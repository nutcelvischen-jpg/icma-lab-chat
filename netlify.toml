[build]
  # Skip the build (and its credits) when only knowledge.md or docs changed: the function reads knowledge.md live from GitHub.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)knowledge.md' ':(exclude)*.gs' ':(exclude)README.md'"
  publish = "public"
  functions = "netlify/functions"

[functions]
  included_files = ["knowledge.md"]
